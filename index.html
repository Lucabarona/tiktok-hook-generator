<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Hook Generator - Accesso Illimitato</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 { font-size: 24px; margin-bottom: 10px; color: #38bdf8; }
        p { color: #94a3b8; margin-bottom: 20px; }
        .btn {
            background-color: #6366f1;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #4f46e5; }
        .locked-content { display: none; margin-top: 20px; text-align: left; }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            margin-top: 10px;
            resize: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>TikTok Hook Generator</h1>
        <p>Ottieni ganci virali illimitati per i tuoi video su TikTok.</p>

        <!-- Sezione bloccata (visibile prima del pagamento) -->
        <div id="paywall">
            <p>Sblocca l'accesso illimitato per soli 2,00 € (una tantum).</p>
            <a href="https://buy.stripe.com/4gMbJ23mA6FP3Hg8Wi0VO01" class="btn">Sblocca Subito (2,00 €)</a>
        </div>

        <!-- Sezione sbloccata (visibile dopo il pagamento) -->
        <div id="app-content" class="locked-content">
            <h3 style="color: #22c55e;">Accesso Illimitato Sbloccato! 🎉</h3>
            <p>Digita l'argomento del tuo video:</p>
            <input type="text" id="topic" placeholder="Es. Fitness per principianti" style="width:100%; padding:10px; border-radius:6px; border:1px solid #475569; background:#0f172a; color:#fff;">
            <br><br>
            <button class="btn" onclick="generateHook()">Genera Hook</button>
            <textarea id="result" placeholder="Il tuo hook apparirà qui..." readonly></textarea>
        </div>
    </div>

    <script>
        // Controlla se l'utente è tornato da Stripe con ?unlocked=true
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('unlocked') === 'true') {
            // Salva lo sblocco nel browser così non deve ripagarre se ricarica la pagina
            localStorage.setItem('tiktok_unlocked', 'true');
        }

        // Se ha pagato (tramite URL o memoria locale), mostra l'app e nascondi il paywall
        if (localStorage.getItem('tiktok_unlocked') === 'true' || urlParams.get('unlocked') === 'true') {
            document.getElementById('paywall').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
        }

        // Esempio di funzione generatrice
        function generateHook() {
            const topic = document.getElementById('topic').value;
            const hooks = [
                `Tutti fanno ${topic} nel modo sbagliato, ecco l'unico errore che ti sta bloccando.`,
                `Non comprare nulla su ${topic} prima di aver visto questo video.`,
                `Il segreto che i professionisti di ${topic} non vorrebbero mai farti scoprire.`
            ];
            const randomHook = hooks[Math.floor(Math.random() * hooks.length)];
            document.getElementById('result').value = topic ? randomHook : "Inserisci prima un argomento valido!";
        }
    </script>

</body>
</html>
