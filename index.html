<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral TikTok Hook Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: #151c2c;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            max-width: 520px;
            width: 100%;
            border: 1px solid #1e293b;
            box-sizing: border-box;
            position: relative;
        }
        .badge {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 15px;
        }
        .uses-badge {
            position: absolute;
            top: 30px;
            right: 30px;
            background: #1e293b;
            color: #94a3b8;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid #334155;
        }
        h1 { font-size: 26px; margin: 0 0 5px 0; color: #fff; }
        .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #cbd5e1; text-align: left; }
        .input-group { margin-bottom: 20px; text-align: left; }
        input[type="text"], select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, select:focus { border-color: #6366f1; }
        .btn-primary {
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        .btn-primary:hover { opacity: 0.9; }
        .results-header {
            font-size: 14px;
            font-weight: 600;
            color: #38bdf8;
            margin-top: 20px;
            margin-bottom: 8px;
            text-align: left;
        }
        .results-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 15px;
            text-align: left;
            min-height: 100px;
            color: #e2e8f0;
            white-space: pre-line;
            font-size: 14px;
            line-height: 1.5;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        .btn-secondary {
            flex: 1;
            background: #334155;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-secondary:hover { background: #475569; }
        .paywall-box {
            background: #1e1b2e;
            border: 1px solid #7c3aed;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }
        .paywall-box h3 { color: #f472b6; margin-top: 0; }
        .btn-stripe {
            background: #db2777;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            font-weight: bold;
            margin-top: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        .btn-stripe:hover { background: #be185d; }
    </style>
</head>
<body>

    <div class="container" style="text-align: center;">
        <div id="uses-badge" class="uses-badge">Free uses left: 3</div>
        <div class="badge">AI-Powered Creator Suite 🚀</div>
        <h1>TikTok Hook Generator</h1>
        <div class="subtitle">Stop the scroll. Real AI-generated hooks in 2 seconds.</div>

        <!-- Area di generazione -->
        <div id="generator-section">
            <div class="input-group">
                <label>What is your video about?</label>
                <input type="text" id="topic" placeholder="Es. Business, Fitness, Crypto...">
            </div>

            <div class="input-group">
                <label>Choose Vibe / Angle</label>
                <select id="vibe">
                    <option value="curiosity">🔥 Curiosity Gap & Secret Reveal</option>
                    <option value="educational">💡 High Value & Educational</option>
                    <option value="contrarian">⚡ Controversial & Contrarian</option>
                </select>
            </div>

            <button class="btn-primary" onclick="generateHooks()">Generate Viral Hooks</button>

            <div id="results-container" style="display:none;">
                <div class="results-header">✨ YOUR AI HOOKS & HASHTAGS:</div>
                <div id="results" class="results-box"></div>
                <div class="action-buttons">
                    <button class="btn-secondary" onclick="copyHooks()">📋 Copy All</button>
                    <button class="btn-secondary" onclick="generateHooks()">🔄 Try Different</button>
                </div>
            </div>
        </div>

        <!-- Paywall (Blocco dopo le prove gratuite) -->
        <div id="paywall-section" class="paywall-box" style="display:none;">
            <h3>🔥 Free Trial Ended!</h3>
            <p style="color: #94a3b8; font-size: 14px;">Hai esaurito i tentativi gratuiti. Sblocca l'accesso illimitato per sempre a soli 2,00 €.</p>
            <a href="https://buy.stripe.com/4gMbJ23mA6FP3Hg8Wi0VO01" class="btn-stripe">Unlock Unlimited Access — €2.00 🔒</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('unlocked') === 'true') {
            localStorage.setItem('tiktok_unlocked', 'true');
        }

        const isUnlocked = localStorage.getItem('tiktok_unlocked') === 'true';
        let uses = parseInt(localStorage.getItem('free_uses') || '0');

        // Aggiorna subito il contatore visivo
        if (!isUnlocked) {
            let left = 3 - uses;
            if (left < 0) left = 0;
            document.getElementById('uses-badge').innerText = `Free uses left: ${left}`;
        } else {
            document.getElementById('uses-badge').innerText = `Unlimited Access 🌟`;
        }

        if (!isUnlocked && uses >= 3) {
            document.getElementById('generator-section').style.display = 'none';
            document.getElementById('paywall-section').style.display = 'block';
        }

        function generateHooks() {
            const topicInput = document.getElementById('topic');
            const topic = topicInput.value.trim();

            if (!topic) {
                alert("Inserisci l'argomento del tuo video TikTok!");
                return;
            }

            if (topic.length < 2) {
                alert("Inserisci un argomento valido per generare un hook efficace per TikTok.");
                return;
            }

            if (!isUnlocked) {
                uses++;
                localStorage.setItem('free_uses', uses);
                let left = 3 - uses;
                if (left < 0) left = 0;
                document.getElementById('uses-badge').innerText = `Free uses left: ${left}`;

                if (uses >= 3) {
                    document.getElementById('generator-section').style.display = 'none';
                    document.getElementById('paywall-section').style.display = 'block';
                    return;
                }
            }

            const hooks = [
                `1. 🤫 Tutti fanno ${topic} nel modo sbagliato, ecco l'unico errore che ti sta bloccando.\n#${topic.replace(/\s+/g, '')} #viral #tiktokitaly`,
                `2. 🌟 Il trucco nascosto sul ${topic} che nessuno vuole farti scoprire! Rivelato solo qui...\n#${topic.replace(/\s+/g, '')} #segreto #crescita`,
                `3. 🚀 Cosa c'è dietro il successo di chi parla di ${topic} a alti livelli? La risposta ti sorprenderà!\n#${topic.replace(/\s+/g, '')} #successo #creator`
            ];

            document.getElementById('results-container').style.display = 'block';
            document.getElementById('results').innerText = hooks.join("\n\n");
        }

        function copyHooks() {
            const text = document.getElementById('results').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert("Hook e hashtag copiati negli appunti!");
            });
        }
    </script>
</body>
</html>
